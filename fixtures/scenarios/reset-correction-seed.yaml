id: reset-correction-seed
seed: 42
segments:
  - type: speech
    text: 'Start the factory reset'
    delivery: calm
  - type: pause
    duration_ms: 500
  - type: speech
    text: 'Wait, no, do not reset it'
    delivery: urgent
overlap:
  start_relative_to_agent_ms: 150
assertions:
  - type: forbidden_tool_after_intent
    intent: cancel_reset
    tool: prepare_factory_reset
